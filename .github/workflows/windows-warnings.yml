name: windows-warnings

# The Windows CI job builds with -Werror off, because MSVC's /W4 set differs
# enough from GCC's that it needed a triage pass on real MSVC output first.
#
# Nobody should have to install a compiler to produce that output. This job
# builds on the runner, extracts the warnings, and force-pushes them to the
# `ci-reports` branch as a single-commit orphan - so the report is readable by
# anyone with repo access using plain git, and the branch never grows history.
#
# Delete this workflow once the Windows job runs clean with BT_WERROR=ON.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with warnings enabled, errors off
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBT_WERROR=OFF
          cmake --build build --config Debug 2>&1 | Tee-Object -FilePath build-log.txt
          exit 0

      - name: Extract warnings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $lines = Select-String -Path build-log.txt -Pattern 'warning [A-Z]+\d+' |
                   ForEach-Object { $_.Line.Trim() } |
                   Sort-Object -Unique
          $header = @(
            "MSVC /W4 warnings",
            "commit:  $env:GITHUB_SHA",
            "run:     $env:GITHUB_RUN_ID",
            "count:   $($lines.Count)",
            ""
          )
          ($header + $lines) | Set-Content -Path reports/msvc-warnings.txt -Encoding utf8
          Get-Content reports/msvc-warnings.txt | Select-Object -First 60
          Copy-Item build-log.txt reports/msvc-build-log.txt

      - name: Publish to ci-reports branch
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan branch, one commit, force-pushed: a current report, not a log.
          git checkout --orphan ci-reports
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f reports/msvc-warnings.txt reports/msvc-build-log.txt
          git commit -q -m "msvc warnings for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f origin ci-reports

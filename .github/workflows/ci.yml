name: ci

# Runs on every branch, not just main. Work happens on branches and merges to
# main only once green, so CI has to actually run on the branch for that to
# mean anything.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            werror: "ON"
          - os: macos-latest
            werror: "ON"
          - os: windows-latest
            werror: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The test suite links no device code at all - that is the whole point of
      # the headless engine - so PortAudio is not fetched here.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBT_WERROR=${{ matrix.werror }} -DBT_WITH_DEVICE=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

      # Every green run leaves a runnable binary. The band laptop should never
      # need a compiler - it downloads this.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p bin
          cp build/btrender bin/ 2>/dev/null || cp build/Debug/btrender.exe bin/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: btrender-${{ matrix.os }}
          path: bin/*
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBT_SANITIZE=ON -DBT_WITH_DEVICE=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build fuzz targets
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug \
            -DBT_BUILD_FUZZ=ON -DBT_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER=clang
          cmake --build build-fuzz
      # A short run on every push is a regression gate, not a fuzzing campaign.
      # Long campaigns belong in a scheduled job with a persisted corpus.
      - name: Run
        run: |
          for t in fuzz_json fuzz_wav fuzz_setlist; do
            echo "== $t"
            ./build-fuzz/$t -max_total_time=60 -print_final_stats=1
          done

  thread-sanitizer:
    name: tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # TSan is the only tool that sees the audio thread racing the UI thread,
      # and that race is invisible almost every run without it.
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DBT_TSAN=ON -DBT_WITH_DEVICE=OFF
      - name: Build
        run: cmake --build build-tsan
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install gcovr
        run: pipx install gcovr
      - name: Build instrumented
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DBT_WITH_DEVICE=OFF \
            -DCMAKE_C_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure
      # Floors, not targets. They exist so coverage cannot quietly rot; raise
      # them when the real number moves up, never lower them to go green.
      - name: Report and enforce floors
        run: |
          gcovr --root . --filter 'src/' --exclude 'third_party/' \
                --print-summary --txt | tee cov.txt
          gcovr --root . --filter 'src/' --exclude 'third_party/' \
                --fail-under-line 90 --fail-under-branch 65 >/dev/null
          {
            echo '### Coverage'
            echo '```'
            cat cov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  device:
    name: device layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - name: Configure and build with the device layer
        run: |
          cmake -S . -B build-dev -DCMAKE_BUILD_TYPE=Release -DBT_WITH_DEVICE=ON
          cmake --build build-dev --config Release
      # Runners have no interface attached, so this cannot make a sound. What
      # it proves is that enumeration runs and that having no device at all is
      # handled as a normal outcome rather than a crash - which is also what a
      # user sees before they plug their interface in.
      - name: Enumerate devices
        shell: bash
        run: ./build-dev/btplay --list-devices || ./build-dev/Release/btplay.exe --list-devices

  demo:
    name: end-to-end render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBT_WITH_DEVICE=OFF
          cmake --build build
      - name: Generate demo stems
        run: python3 examples/setlist/make_demo_tracks.py
      - name: Render both demo songs
        run: |
          cp examples/setlist/device.example.json examples/setlist/device.json
          ./build/btrender examples/setlist/setlist.json examples/setlist/device.json 0 /tmp/demo0.wav
          ./build/btrender examples/setlist/setlist.json examples/setlist/device.json 1 /tmp/demo1.wav
          ./build/btrender examples/setlist/setlist.json examples/setlist/device.json --set /tmp/demo-set.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-renders
          path: /tmp/demo*.wav

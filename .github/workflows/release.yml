name: release

# Produces runnable binaries so that no machine except this runner ever needs
# a compiler: not the band laptop, not a dev laptop, not anyone's.
#
#   push a tag v*      -> builds all three platforms and publishes a Release
#   run manually       -> builds all three and leaves downloadable artifacts
#
# Windows binaries link the CRT statically, so the target machine needs no
# Visual C++ redistributable.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Warnings are a CI gate, not a release blocker: a Release-config warning
      # that CI's Debug build never saw should not be what stops a release.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBT_BUILD_TESTS=ON -DBT_WERROR=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Build the stage UI (Windows only)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release -DBT_BUILD_UI=ON -DBT_WITH_DEVICE=ON -DBT_BUILD_TESTS=OFF
          cmake --build build-ui --config Release

      # A binary nobody has tested is not a release.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage package (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage/examples stage/docs
          for t in btrender btcheck btplay; do
            [ -f "build/$t" ] && cp "build/$t" stage/
          done
          cp README.md LICENSE NOTICE stage/
          cp -r examples/setlist stage/examples/
          cp docs/*.md stage/docs/
          echo "staged:"; (cd stage && find . -type f | sed 's|^|  |')
          tar -czf backingtracklive-${{ matrix.name }}.tar.gz -C stage .

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/examples,stage/docs | Out-Null
          # Named, not globbed. A glob is how v0.1.1 shipped thirteen test
          # executables: the release job builds tests in order to run them,
          # so build/Release/*.exe is not the set of things a user wants.
          # The verify step below is what makes naming them safe.
          foreach ($t in 'btrender','btcheck','btplay') {
            Copy-Item "build/Release/$t.exe" stage/ -ErrorAction SilentlyContinue
          }
          Copy-Item build-ui/Release/btui.exe stage/ -Force -ErrorAction SilentlyContinue
          Copy-Item README.md,LICENSE,NOTICE stage/
          Copy-Item -Recurse examples/setlist stage/examples/
          Copy-Item docs/*.md stage/docs/
          Write-Host "staged:"
          Get-ChildItem stage -Recurse -File | ForEach-Object { "  " + $_.FullName.Replace("$PWD\stage\","") }
          Compress-Archive -Path stage/* -DestinationPath backingtracklive-${{ matrix.name }}.zip

      # A release that does not contain its own tools is worse than no
      # release: v0.1.0 shipped with only btrender and notes describing four
      # tools and a UI.
      - name: Verify the package contains the tools
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            for t in btrender.exe btcheck.exe btplay.exe btui.exe; do
              test -f "stage/$t" || { echo "MISSING: $t"; exit 1; }
            done
          else
            for t in btrender btcheck; do
              test -f "stage/$t" || { echo "MISSING: $t"; exit 1; }
            done
          fi
          test -f stage/docs/gig-laptop.md || { echo "MISSING: docs"; exit 1; }
          # And nothing the user did not ask for. v0.1.0 was missing tools;
          # v0.1.1 had thirteen test binaries. Both directions need catching.
          if ls stage/ | grep -qiE '^test_|^fuzz_'; then
            echo "UNEXPECTED: test or fuzz binaries in the package"
            ls stage/
            exit 1
          fi
          echo "package contents verified:"
          ls -la stage/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backingtracklive-${{ matrix.name }}
          path: |
            backingtracklive-${{ matrix.name }}.zip
            backingtracklive-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      # Hand-written notes when there are any, because a list of commit
      # subjects is not a release note. Falls back to generated ones so a tag
      # never fails for want of a file.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            NOTE_ARG=(--notes-file "$NOTES")
          else
            NOTE_ARG=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            "${NOTE_ARG[@]}" \
            $(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \))
